th: 2px;" stroke="#1a1b27"></path></g><g class="arc" style="--gpsc-i: 2;"><path d="M-48.339,-35.543A60,60,0,0,1,-24.81,-54.63L-14.473,-31.868A35,35,0,0,0,-28.198,-20.734Z" style="fill: #3572A5; stroke-width: 2px;" stroke="#1a1b27"></path></g><g class="arc" style="--gpsc-i: 3;"><path d="M-24.81,-54.63A60,60,0,0,1,-10.374,-59.096L-6.052,-34.473A35,35,0,0,0,-14.473,-31.868Z" style="fill: #b07219; stroke-width: 2px;" stroke="#1a1b27"></path></g><g class="arc" style="--gpsc-i: 4;"><path d="M-10.374,-59.096A60,60,0,0,1,0,-60L0,-35A35,35,0,0,0,-6.052,-34.473Z" style="fill: #00ADD8; stroke-width: 2px;" stroke="#1a1b27"></path></g></g></g></g></svg>